<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pricing Plans Layout Page</title>
    <link rel="stylesheet" href="styles.css"
  </head>
  <body>
    <header>
    <h1 id="heading">Pricing Plans</h1>
    </header>
    <div class="pricing-container">
      <div class="pricing-card  basic-plan">
        <h2 id="basic">Basic</h2>
        <p class="rate">$9/month</p>
        <hr>
        <label>
        <span class="tick" >✓</span>
        <p class="features">Access to our core features</p>
        </label>
        <label>
       <span class="tick" >✓</span>
        <p class="features">Email support</p>
        </label>
        <label>
        <span class="wrong" >✗</span>
        <p class="features">Advaced analytics</p>
        </label>
        <label>
        <span class="wrong" >✗</span>
        <p class="features">Custom Integration</p>
        </label>
        <label>
        <span class="wrong" >✗</span>
        <p class="features">Priority support</p>
        </label>
        <button type="submit">Choose Plan</button>
      </div>
      <div class="pricing-card pro-plan">
        <h2>Pro</h2>
        <p class="rate">$19/month</p>
        <hr>
        <label>
        <span class="tick">✓</span>
        <p class="features">Access to our core features</p>
        </label>
        <label>
        <span  class="tick">✓</span>
        <p class="features">Email support</p>
        </label>
        <label>
        <span  class="tick">✓</span>
        <p class="features">Advaced analytics</p>
        </label>
        <label>
        <span class="tick">✓</span>
        <p class="features">Custom Integration</p>
        </label>
        <label>
        <span class="wrong">✗</span>
        <p class="features">Priority support</p>
        </label>
        <button type="submit">Choose Plan</button>
      </div>
      <div class="pricing-card premium-plan">
        <h2>Premium</h2>
        <p class="rate">$29/month</p>
      <hr>
        <label>
        <span class="tick">✓</span>
        <p class="features">Access to our core features</p>
        </label>
        <label>
        <span class="tick">✓</span>
        <p class="features">Email support</p>
        </label>
        <label>
        <span class="tick">✓</span>
        <p class="features">Advaced analytics</p>
        </label>
        <label>
        <span class="tick">✓</span>
        <p class="features">Custom Integration</p>
        </label>
        <label>
        <span class="tick">✓</span>
        <p class="features">Priority support</p>
        </label>
        <button type="submit">Choose Plan</button>
      </div>
    </div>

</html>>
