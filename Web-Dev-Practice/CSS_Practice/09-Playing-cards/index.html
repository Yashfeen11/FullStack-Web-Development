<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="playing-cards">
        <div class="card" >
            <div class="left">
             <div class="a">
                <p class="plain">A</p>
                <span class="up">♠</span>
            </div>
            <div id="spade">
                <span>♠</span>
            </div>
            <div class="b">
                <span class="down">♠</span>
                <p class="invert">A</p>
            </div>
            </div>
        </div>
        <div class="card" >
            <div class="middle">
            <div>
                <p class="plain">2</p>
                <span class="up">♣</span>
            </div>
            <div id="leaf">
                <span>♣</span>
                <span id="rotateleaf">♣</span>
                
            </div>
            <div class="b">
                <span class="down">♣</span>
                <p class="invert">2</p>
            </div>
            </div>
        </div>
        <div class="card" >
            <div class="right">
            <div>
                <p class="plain">3</p>
                <span class="up ">♥</span>
            </div>
            <div id="heart">
                <span>♥</span>
                <span>♥</span>
                <span>♥</span>
            </div>
            <div class="b">
                <span class="down">♥</span>
                <p class="invert">3</p>
            </div>
            </div>
        </div>
        <div class="card" >
            <div class="bottom-left">
             <div>
               <p class="plain">4</p>
                <span class="up">♠</span>
             </div>
             <div id="spade-heart">
                <span>♠♠</span>
                <span>♠♠</span>
                
             </div>
             <div class="b">
                <span class="down">♠</span>
                <p class="invert">4</p>
            </div>
            </div>
        </div>
        <div class="card" >
            <div class="bottom-right">
                <div>
                <p class="plain">5</p>
                <span class="up">♦</span>
                </div>
                <div id="diamond">
                    <span>♦♦</span>
                    <span id="di"> ♦ </span>
                    <span>♦♦</span>
            
                </div>
                <div class="b">
                <span class="down">♦</span>
                <p class="invert">5</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
